# MathPipeline settings
paths:
  db: data/math.db
  renders: data/renders
  quarantine: data/quarantine
  chuyende: data/chuyende
  schema: db/schema.sql

tools:
  # full path to xelatex (MiKTeX). Override per machine; falls back to PATH.
  xelatex: C:\Users\NGOCD\AppData\Local\Programs\MiKTeX\miktex\bin\x64\xelatex.exe

ocr:
  engine: gemini             # local (pix2text+easyocr, free offline) | gemini (full-page, higher quality)
  workers: 6                 # concurrent ingest workers (gemini = API-bound, can be high; local keep ~2)
  render_dpi: 200            # DPI for rendering scan pages
  text_layer_min_cpp: 200    # chars/page >= this => born-digital TEXT
  scan_max_cpp: 40           # chars/page <= this => SCAN
  sample_pages: 6            # pages to sample when classifying a doc

scalpel:
  provider: gemini           # free-tier VLM for dense-inline / low-conf blocks
  enabled: false             # set true once a key is configured

dedup:
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  minhash_threshold: 0.85
  cosine_threshold: 0.90
